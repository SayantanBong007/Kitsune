# Kitsune's shared servers for a team: Qdrant (vectors, raw code, keyword index) and
# Neo4j (graph, cross-service links, lore).
#
#   docker compose up -d          # start (data survives restarts and `docker compose down`)
#   docker compose down -v        # stop AND delete all indexed data
#
# Then point Kitsune at them (e.g. in kitsune/.env):
#   QDRANT_URL=http://localhost:6333
#   QDRANT_API_KEY=${QDRANT_API_KEY}
#   NEO4J_URI=bolt://localhost:7687
#   NEO4J_PASSWORD=${NEO4J_PASSWORD}
#   KITSUNE_REQUIRE_SERVERS=1
#
# Set QDRANT_API_KEY and NEO4J_PASSWORD in your shell or a .env next to this file
# (both git-ignored); the defaults below are for a laptop only.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes: ["qdrant_data:/qdrant/storage"]

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kitsune_password}
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

volumes:
  qdrant_data:
  neo4j_data:
